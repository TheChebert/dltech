<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1440"
     height="280"
     viewBox="0 0 1440 280"
     role="img"
     aria-labelledby="title description">
  <title id="title">Driftline Tech primary horizontal logo</title>
  <desc id="description">The official three-part blue and navy forward-chevron mark with the Driftline Tech wordmark.</desc>

  <defs>
    <linearGradient id="primary-chevron-gradient" x1="0" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#006EFD"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
    <linearGradient id="lower-chevron-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#006EFD"/>
      <stop offset="0.72" stop-color="#006EFD"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
    <linearGradient id="left-divider-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#006EFD"/>
    </linearGradient>
    <linearGradient id="right-divider-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#006EFD"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
  </defs>

  <!-- Transparent background. Every visible element is an editable vector path or shape. -->
  <g id="driftline-tech-primary-logo">
    <g id="forward-chevron-icon" transform="translate(12 8)">
      <path id="navy-upper-chevron"
            fill="#0B1626"
            d="M118 0H250C275 0 293 9 311 29L356 79C377 103 373 132 350 151L301 185C317 160 316 140 299 120L253 67C243 55 232 49 215 49H145Z"/>
      <path id="gradient-center-chevron"
            fill="url(#primary-chevron-gradient)"
            d="M211 64H269C283 64 293 69 303 81L330 113C353 140 353 170 329 195L247 253C235 261 220 265 204 265H137L263 154C269 149 269 143 264 137Z"/>
      <path id="blue-lower-chevron"
            fill="url(#lower-chevron-gradient)"
            d="M18 265L136 166C145 159 155 156 167 156H239L105 265Z"/>
    </g>

    <!-- DRIFTLINE custom geometric wordmark, outlined as independent vector letters. -->
    <g id="driftline-wordmark" fill="#0B1626" fill-rule="evenodd">
      <path id="letter-d" transform="translate(420 58)"
            d="M0 0H64C100 0 120 18 120 50S100 100 64 100H0ZM28 24V76H60C80 76 91 67 91 50S80 24 60 24Z"/>
      <path id="letter-r" transform="translate(554 58)"
            d="M0 0H62C92 0 108 15 108 42C108 60 99 72 84 78L110 100H75L52 81H28V100H0ZM28 23V58H59C73 58 80 52 80 41S73 23 59 23Z"/>
      <path id="letter-i-1" transform="translate(678 58)" d="M0 0H28V100H0Z"/>
      <path id="letter-f" transform="translate(720 58)" d="M0 0H100V24H28V43H88V66H28V100H0Z"/>
      <path id="letter-t" transform="translate(834 58)" d="M0 0H100V25H64V100H36V25H0Z"/>
      <path id="letter-l" transform="translate(948 58)" d="M0 0H28V75H92V100H0Z"/>
      <path id="letter-i-2" transform="translate(1054 58)" d="M0 0H28V100H0Z"/>
      <path id="letter-n" transform="translate(1096 58)" d="M0 0H27L87 65V0H115V100H88L28 35V100H0Z"/>
      <path id="letter-e" transform="translate(1225 58)" d="M0 0H98V24H28V40H88V63H28V76H98V100H0Z"/>
    </g>

    <g id="tech-lockup" fill="#0B1626">
      <rect id="left-divider" x="420" y="211" width="208" height="6" rx="3" fill="url(#left-divider-gradient)"/>
      <rect id="right-divider" x="1110" y="211" width="245" height="6" rx="3" fill="url(#right-divider-gradient)"/>

      <g id="tech-wordmark" transform="translate(657 190)">
        <path id="tech-t" d="M0 0H50V7H29V44H21V7H0Z"/>
        <path id="tech-e" transform="translate(121 0)" d="M0 0H46V7H8V19H38V26H8V37H46V44H0Z"/>
        <path id="tech-c" transform="translate(243 0)" d="M48 6C42 2 35 0 27 0C11 0 0 9 0 22S11 44 27 44C35 44 42 42 48 38L44 31C39 35 34 37 27 37C16 37 8 31 8 22S16 7 27 7C34 7 39 9 44 13Z"/>
        <path id="tech-h" transform="translate(376 0)" d="M0 0H8V18H45V0H53V44H45V26H8V44H0Z"/>
      </g>
    </g>
  </g>
</svg>
